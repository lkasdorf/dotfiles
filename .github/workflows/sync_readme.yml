name: Sync README to Root

# Copies dotfiles_docs/README.md to README.md on main and commits the result
# directly. Actions may not open pull requests in this repo, and a push made
# with GITHUB_TOKEN does not trigger another workflow run, so there is no loop.
on:
  push:
    branches: [main]
    paths:
      - 'dotfiles_docs/README.md'
      - '.github/workflows/sync_readme.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Copy README from docs to root
        run: cp dotfiles_docs/README.md README.md

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- README.md && git ls-files --error-unmatch README.md >/dev/null 2>&1; then
            echo "README.md is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync README from dotfiles_docs to root"
          git push origin HEAD:main
