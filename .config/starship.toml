# ------------------------------------------------------------
# Starship config (optimized, based on your current file)
# ------------------------------------------------------------

# Your multi-line prompt layout (enabled)
# format = """
# [╭─user───❯](bold blue) $username
# [┣─system─❯](bold yellow) $hostname
# [┣─project❯](bold red) $directory$rust$git_branch$git_state$git_status$package$golang$terraform$docker_context$python$nodejs
# [╰─cmd────❯](bold green) $cmd_duration$status
# $character
# """

format = "$username$hostname$directory$git_branch$git_state$git_status$rust$golang$terraform$docker_context$python$nodejs$cmd_duration$status$character"
add_newline = false

command_timeout = 800
scan_timeout = 1000

# ------------------------------------------------------------
# Identity
# ------------------------------------------------------------
[username]
style_user = "blue bold"
style_root = "red bold"
format = "[$user]($style) "
disabled = false
show_always = true

[hostname]
ssh_only = true
format = "on [$hostname](#6E94AB) "
trim_at = "."
disabled = false

# ------------------------------------------------------------
# Prompt character
# ------------------------------------------------------------
[character]
success_symbol = "[❯](blue)"
error_symbol = "[❯](red)"
vicmd_symbol = "[❮](blue)"

# ------------------------------------------------------------
# Directory
# ------------------------------------------------------------
[directory]
read_only = "  "
truncation_length = 4
truncate_to_repo = true
style = "bold blue"

# ------------------------------------------------------------
# Duration + exit status
# ------------------------------------------------------------
[cmd_duration]
# 10ms is basically everything; this becomes noise fast.
# 500ms is a sweet spot; adjust to taste (300–1000ms).
min_time = 800
show_milliseconds = false
disabled = false
style = "yellow"
format = "took [$duration]($style) "

[status]
disabled = false
format = "exit [$status](bold red) "

# ------------------------------------------------------------
# Common symbols (keep your style)
# ------------------------------------------------------------
[aws]
symbol = "  "

[conda]
symbol = " "

[dart]
symbol = " "

[elixir]
symbol = " "

[elm]
symbol = " "

[golang]
symbol = " "

[hg_branch]
symbol = " "

[java]
symbol = " "

[julia]
symbol = " "

[haskell]
symbol = "λ "

[memory_usage]
symbol = " "

[nim]
symbol = " "

[nix_shell]
symbol = " "

[package]
symbol = " "
# reduce noise: show package only when it matters
display_private = false

[perl]
symbol = " "

[php]
symbol = " "

[ruby]
symbol = " "

[rust]
symbol = " "

[scala]
symbol = " "

[shlvl]
symbol = " "
# keep it off unless you really need nested shell depth:
disabled = true

[swift]
symbol = "ﯣ "

# ------------------------------------------------------------
# Docker
# ------------------------------------------------------------
[docker_context]
symbol = " "
format = "via [$symbol$context]($style) "
style = "blue bold"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_folders = []
disabled = false

# ------------------------------------------------------------
# Git
# ------------------------------------------------------------
[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold"

[git_status]
# keep your bracketed style, but make it reliable & not too wide
format = "([\\[$all_status$ahead_behind\\]]($style) )"
stashed = "[${count}*](green)"
modified = "[${count}+](yellow)"
deleted = "[${count}-](red)"
conflicted = "[${count}~](red)"
ahead = "⇡${count}"
behind = "⇣${count}"
untracked = "[${count}?](blue)"
staged = "[${count}+](green)"

[git_state]
style = "bold red"
format = "[$state( $progress_current/$progress_total) ]($style)"
rebase = "rebase"
merge = "merge"
revert = "revert"
cherry_pick = "cherry"
bisect = "bisect"
am = "am"
am_or_rebase = "am/rebase"

# ------------------------------------------------------------
# Python
# ------------------------------------------------------------
[python]
symbol = "🐍 "
format = "via [${symbol}python ${version} (\\($virtualenv\\) )]($style)"
style = "bold yellow"
pyenv_prefix = "venv "
python_binary = ["./venv/bin/python", "python", "python3", "python2"]
detect_extensions = ["py"]
version_format = "v${raw}"

# ------------------------------------------------------------
# Node.js
# ------------------------------------------------------------
[nodejs]
# Your format is cool; keep it. But detection via node_modules is noisy.
format = "via [ Node.js $version](bold green) "
detect_files = ["package.json", ".node-version", ".nvmrc", "pnpm-lock.yaml", "yarn.lock", "package-lock.json"]
detect_folders = []   # avoid always triggering in big repos
disabled = false
